plugins {
    id 'application'
    id 'java'
}

dependencies { implementation project(':core') }

application { mainClass = 'ru.lighthouse.desktop.DesktopApp' }

tasks.named('processResources') {
    from(rootProject.file('version.properties'))
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.register('uiRegressionTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ru.lighthouse.desktop.DesktopDashboardTest'
    workingDir rootProject.projectDir
    systemProperty 'java.awt.headless', 'true'
}

tasks.named('check') { dependsOn uiRegressionTest }

tasks.register('portableZip', Zip) {
    dependsOn installDist
    from(layout.buildDirectory.dir('install/desktop'))
    archiveFileName = "Lighthouse-PC-${project.version}.zip"
    destinationDirectory = rootProject.layout.buildDirectory.dir('releases')
}
